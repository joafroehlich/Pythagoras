<pre><b><p class ="Aufgabe">Pythagoras Aufgabe 3

Eine Leiter ist 6 m lang und steht am Fußpunkt 
1,3 m von einer Wand entfernt. In welcher 
Höhe h in m berührt die Leiter die Wand?
<img src="Aufgabe2L.jpg" >

6<sup>2</sup> m<sup>2</sup> = h<sup>2</sup> + 1,3<sup>2</sup> m<sup>2</sup> |-1,3<sup>2</sup> m<sup>2</sup> 

h<sup>2</sup> = 6<sup>2</sup> m<sup>2</sup> - 1,3<sup>2</sup> m<sup>2</sup> = 34,3 m<sup>2</sup> 

h = <math ><msqrt><mrow><mn>34,3</mn><msup><mi mathvariant="normal">m</mi><mn>2</mn></msup></mrow></msqrt></math>

<span style="color:red;">h = 5,9 m</span></p></b></pre>
