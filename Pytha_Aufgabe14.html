<pre><b><p class ="Aufgabe">Pythagoras Aufgabe 14

Ein Baum ist bei einem Sturm in 4 m Höhe 
abgeknickt. Seine Spitze liegt 15 m vom Stamm 
entfernt. Wie hoch war der Baum in m?

<img src="Aufgabe8.jpg" >

l<sup>2</sup> = 4<sup>2</sup> m<sup>2</sup> + 15<sup>2</sup> m<sup>2</sup> = 241 m<sup>2</sup> |√ 

h = <math ><msqrt><mrow><mn>241</mn><msup><mi mathvariant="normal">m</mi><mn>2</mn></msup></mrow></msqrt></math>  = 15,5 m

Der Baum war 4 m + 15,5 m = <span style="color:red;">19,5 m</span> hoch.
