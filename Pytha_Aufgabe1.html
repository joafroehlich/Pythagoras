<pre><b><p class ="Aufgabe">Pythagoras Aufgabe 1

Wie lang ist die Kathete a in cm, wenn die 
Kathete b = 7,8 cm und die Hypotenuse 
c = 9,8 cm lang sind? 

<img src="Aufgabe1.jpg" >

c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> | -b<sup>2</sup> 

a<sup>2</sup> = c<sup>2</sup> - b<sup>2</sup> 

a<sup>2</sup> = 9,8<sup>2</sup> cm<sup>2</sup> - 7,8<sup>2</sup> cm<sup>2</sup> = 35,2 cm<sup>2</sup> |√ 

a = <math ><msqrt><mrow><mn>35,2</mn><msup><mi mathvariant="normal">cm</mi><mn>2</mn></msup></mrow></msqrt></math>

<span style="color:red;">a = 5,9 cm</span></p></b></pre>
