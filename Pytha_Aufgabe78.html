Satz von Pythagoras im Dreieck ABC: 

s<sup>2</sup> = AB<sup>2</sup> + AC<sup>2</sup> 

s<sup>2</sup> = 8<sup>2</sup> cm<sup>2</sup> + 5<sup>2</sup> cm<sup>2</sup> = 89 cm<sup>2</sup> |√ 

s = 9,4 cm 

Satz von Pythagoras im Dreieck CBD: 

d<sup>2</sup> = s<sup>2</sup> + CD<sup>2</sup> 

d<sup>2</sup> = 9,4<sup>2</sup> cm<sup>2</sup> + 3<sup>2</sup> cm<sup>2</sup> = 97,9 cm<sup>2</sup> |√
