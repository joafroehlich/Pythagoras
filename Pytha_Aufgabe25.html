<pre><b><p class ="Aufgabe">Pythagoras Aufgabe 25

AC = |-3| cm + 3 cm = 6 cm 

CB = 4cm - 1 cm = 3 cm 

Satz von Pythagoras im Dreieck ACB: 

AB<sup>2</sup> = AC<sup>2</sup> + CB<sup>2</sup> 

AB<sup>2</sup> = 6<sup>2</sup> cm<sup>2</sup> + 5<sup>2</sup> cm<sup>2</sup> = 45 cm<sup>2</sup> |√
